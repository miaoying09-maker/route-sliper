<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UniUni 路线号+地址（极简/更准/Google）</title>
  <style>
    :root{ font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    body{ margin:0; background:#f6f7fb; color:#111; }
    .wrap{ max-width:900px; margin:0 auto; padding:12px; }
    .sticky{
      position:sticky; top:0; z-index:10;
      background:rgba(246,247,251,.96); backdrop-filter: blur(10px);
      border-bottom:1px solid #e6e8ef;
      padding:12px;
      margin:-12px -12px 12px -12px;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{
      border:1px solid #d5d9e6; background:#fff;
      padding:14px 14px; border-radius:16px;
      cursor:pointer; font-size:16px; font-weight:900;
    }
    .btn.primary{ background:#111; color:#fff; border-color:#111; }
    .btn.warn{ background:#fff6e5; border-color:#ffd69a; }
    .btn.danger{ background:#fff3f3; border-color:#ffd3d3; color:#a40000; }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }
    .pill{ font-size:13px; padding:4px 10px; border-radius:999px; border:1px solid #e6e8ef; background:#fff; }
    .hint{ font-size:12px; color:#666; line-height:1.35; }
    .progress{ height:8px; background:#e9ecf7; border-radius:999px; overflow:hidden; margin-top:10px; }
    .bar{ height:100%; width:0%; background:#111; transition: width .2s; }

    .card{ background:#fff; border:1px solid #e6e8ef; border-radius:18px; padding:12px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    .list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }

    .item{
      display:grid; grid-template-columns: 108px 1fr; gap:12px;
      border:1px solid #e6e8ef; border-radius:18px; padding:12px; background:#fff;
      align-items:stretch;
    }
    .routeBox{
      border:1px solid #e6e8ef; background:#fafbff; border-radius:16px;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
    }
    .routeNum{ font-size:46px; font-weight:950; line-height:1; }
    .routeLab{ margin-top:6px; font-size:12px; color:#666; }

    .addr{ font-size:16px; font-weight:800; line-height:1.25; margin-top:4px; }
    .sub{ font-size:12px; color:#666; margin-top:6px; }
    .tag{ font-size:12px; padding:3px 8px; border-radius:999px; border:1px solid #e6e8ef; background:#fff; }
    .meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .smallbtn{
      border:1px solid #d5d9e6; background:#fff;
      padding:10px 12px; border-radius:14px;
      cursor:pointer; font-size:14px; font-weight:900;
    }
    .smallbtn.primary{ background:#111; color:#fff; border-color:#111; }
    .smallbtn.gray{ background:#f2f3f7; }
    input[type="file"]{ width:100%; }
    .edit{
      width:100%; box-sizing:border-box;
      border:1px solid #d5d9e6; border-radius:14px;
      padding:10px; font-size:14px;
      margin-top:8px;
    }
    details{ margin-top:10px; }
    summary{ cursor:pointer; font-weight:900; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="sticky">
    <div class="row">
      <button class="btn primary" id="btnNavNext">Google导航下一条未送 ✅自动勾选</button>
      <button class="btn" id="btnCopyNext">复制下一条未送 ✅自动勾选</button>
      <button class="btn warn" id="btnUndo">撤销上一条</button>
      <button class="btn danger" id="btnClear">清空</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <span class="pill" id="stat">总数 0｜未送 0｜已送 0</span>
      <span class="pill" id="job">待处理 0</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="hint" style="margin-top:10px;">
      iPhone：点下面“选择截图(可多选，约6张)” → “批量导入” → 送单时只点最上面“Google导航下一条未送”。<br>
      本版只识别：<b>路线号（1-4位） + 地址</b>（不识别单号/姓名，减少干扰）。
    </div>
  </div>

  <div class="card">
    <div style="font-weight:950; font-size:18px;">批量导入（更准确：分区识别）</div>
    <div class="hint" style="margin-top:6px;">把截图左侧当“路线号区”，右侧当“地址区”分别识别，提高准确率。</div>

    <div class="row" style="margin-top:12px;">
      <input type="file" id="files" accept="image/*" multiple />
      <button class="btn primary" id="btnImport">批量导入</button>
    </div>

    <details>
      <summary>识别设置（一般不用改）</summary>
      <div class="hint" style="margin-top:8px;">如果路线号偶尔变成 “--”，把“路线号区域宽度”调大更稳。</div>
      <div class="row" style="margin-top:8px;">
        <span class="pill">路线号区域宽度：</span>
        <select id="routeW" class="edit" style="max-width:180px;">
          <option value="0.35">35%</option>
          <option value="0.40" selected>40%</option>
          <option value="0.45">45%</option>
        </select>
        <span class="pill">默认城市：</span>
        <input id="defaultCity" class="edit" style="max-width:320px;" value="Pittsburgh, PA" />
      </div>
      <div class="hint" style="margin-top:8px;">地址缺城市州时，会自动补上默认城市，让 Google Maps 更好找。</div>
    </details>

    <div class="hint" id="hint" style="margin-top:10px;"></div>
  </div>

  <div class="list" id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  // 只存：route + address + checked
  const LS_KEY = "uniuni_route_addr_simple_v2";
  let items = []; // {id, route, address, checked, createdAt}
  let queue = [];
  let processing = false;
  let lastActionStack = []; // undo: store item id toggled to checked

  const el = id => document.getElementById(id);
  const listEl = el("list");

  function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
  function save(){ localStorage.setItem(LS_KEY, JSON.stringify(items)); }
  function load(){
    try{ items = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }
    catch{ items = []; }
  }

  function esc(s){
    return (s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function norm(s){
    return (s||"").replace(/\s+/g," ").replace(/\s*,\s*/g,", ").trim();
  }

  function looksLikeAddressLine(s){
    const t = (s||"").trim();
    if(t.length < 8) return false;
    const hasNo = /\b\d{1,6}\b/.test(t);
    const hasStreet = /\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|ln|lane|way|ct|court|pl|place|pkwy|parkway|hwy|highway|cir|circle|trl|trail)\b/i.test(t);
    return hasNo && (hasStreet || /,\s*[A-Za-z]+\s*,?\s*[A-Z]{2}\b/.test(t) || /\b[A-Z]{2}\s*\d{5}\b/.test(t));
  }

  function navUrlGoogle(dest){
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
  }

  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); }
    catch{
      const ta=document.createElement("textarea");
      ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }
  }

  // ---------- 图像预处理：让字更黑 ----------
  async function preprocess(blob){
    const img = new Image();
    img.decoding = "async";
    const url = URL.createObjectURL(blob);
    img.src = url;
    await img.decode();
    URL.revokeObjectURL(url);

    const scale = Math.min(2.2, Math.max(1.4, 1700 / Math.max(img.width, img.height)));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);

    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d", { willReadFrequently:true });
    ctx.drawImage(img, 0, 0, w, h);

    const im = ctx.getImageData(0,0,w,h);
    const d = im.data;

    const contrast = 1.42;
    for(let i=0;i<d.length;i+=4){
      let gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      gray = (gray - 128) * contrast + 128;
      d[i]=d[i+1]=d[i+2]=gray;
    }

    let sum=0,cnt=0;
    for(let i=0;i<d.length;i+=48*4){ sum += d[i]; cnt++; }
    const avg = sum / Math.max(1,cnt);
    const thr = Math.max(104, Math.min(182, avg - 14));

    for(let i=0;i<d.length;i+=4){
      const v=d[i];
      const bw = v < thr ? 0 : 255;
      d[i]=d[i+1]=d[i+2]=bw;
    }
    ctx.putImageData(im,0,0);

    return { canvas: cv, width: w, height: h };
  }

  function cropToBlob(canvas, sx, sy, sw, sh){
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(sw));
    cv.height = Math.max(1, Math.round(sh));
    const ctx = cv.getContext("2d");
    ctx.drawImage(canvas, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    return new Promise(res => cv.toBlob(res, "image/png", 1.0));
  }

  // ✅ 路线号：只认 1~4 位数字（关键：支持个位数）
  function extractRoute(text){
    const t = (text || "").replace(/\s+/g, " ").trim();

    let m = t.match(/\b(\d{1,4})\b/);
    if (m) return m[1];

    const digits = (t.match(/\d/g) || []).join("");
    if (digits.length >= 1 && digits.length <= 4) return digits;
    if (digits.length > 4) return digits.slice(-4);

    return "";
  }

  function extractAddress(text){
    const lines = (text||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

    let addr = lines.find(looksLikeAddressLine) || "";

    // 合并下一行城市州（常见 Pittsburgh, PA...）
    if(addr){
      const i = lines.indexOf(addr);
      const next = lines[i+1] || "";
      const isCity = /\b[A-Za-z]+\b.*\b[A-Z]{2}\b/.test(next) || /\b[A-Z]{2}\s*\d{5}\b/.test(next);
      if(isCity && next.length <= 60 && !/\b[A-Z]{2}\b/.test(addr)){
        addr = addr + ", " + next;
      }
      return norm(addr);
    }

    const withNo = lines.filter(l => /\b\d{1,6}\b/.test(l));
    if(withNo.length){
      withNo.sort((a,b)=>b.length-a.length);
      return norm(withNo[0]);
    }

    if(lines.length){
      lines.sort((a,b)=>b.length-a.length);
      return norm(lines[0]);
    }
    return "";
  }

  function addItem(route, address){
    route = (route||"").trim();
    address = norm(address||"");
    if(!address) return;

    items.unshift({
      id: uid(),
      route: route || "--",
      address,
      checked: false,
      createdAt: Date.now()
    });
  }

  function dedupe(){
    const seen = new Set();
    const out = [];
    for(const it of items){
      const key = (it.route + "|" + it.address).toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(it);
    }
    items = out;
  }

  function updateTop(){
    const total = items.length;
    const done = items.filter(x=>x.checked).length;
    const todo = total - done;
    el("stat").textContent = `总数 ${total}｜未送 ${todo}｜已送 ${done}`;
    el("job").textContent = `待处理 ${queue.length}${processing ? "（识别中）" : ""}`;
    el("bar").style.width = total ? Math.round(done/total*100) + "%" : "0%";
  }

  function render(){
    updateTop();
    listEl.innerHTML = "";

    if(!items.length){
      listEl.innerHTML = `<div class="card"><div class="hint">还没有数据。先选择截图 → 批量导入。</div></div>`;
      return;
    }

    for(const it of items){
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="routeBox">
          <div class="routeNum">${esc(it.route)}</div>
          <div class="routeLab">路线号</div>
        </div>
        <div>
          <div class="meta">
            <span class="tag">${it.checked ? "✅ 已送" : "⬜ 未送"}</span>
            <button class="smallbtn primary" data-act="nav" data-id="${it.id}">导航（自动勾选）</button>
            <button class="smallbtn" data-act="copy" data-id="${it.id}">复制地址</button>
            <button class="smallbtn gray" data-act="toggle" data-id="${it.id}">${it.checked ? "取消勾选" : "手动勾选"}</button>
            <button class="smallbtn" data-act="edit" data-id="${it.id}">修改</button>
          </div>
          <div class="addr">${esc(it.address)}</div>
          <div class="sub">如果路线号是 “--”，点“修改”手动补这一条即可（只改这一条）。</div>

          <div class="editBox" id="edit-${it.id}" style="display:none;">
            <input class="edit" placeholder="路线号（1-4位）" value="${esc(it.route)}" data-k="route" data-id="${it.id}">
            <input class="edit" placeholder="地址" value="${esc(it.address)}" data-k="address" data-id="${it.id}">
            <div class="row" style="margin-top:8px;">
              <button class="smallbtn primary" data-act="save" data-id="${it.id}">保存</button>
              <button class="smallbtn" data-act="cancel" data-id="${it.id}">取消</button>
            </div>
          </div>
        </div>
      `;
      listEl.appendChild(div);
    }

    listEl.querySelectorAll("button[data-act]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const act = btn.getAttribute("data-act");
        const id = btn.getAttribute("data-id");
        const it = items.find(x=>x.id===id);
        if(!it) return;

        if(act==="nav"){
          it.checked = true;                   // ✅ 导航后自动勾选
          lastActionStack.push(id);
          save(); render();
          window.open(navUrlGoogle(it.address), "_blank");
        }else if(act==="copy"){
          await copyText(it.address);
        }else if(act==="toggle"){
          it.checked = !it.checked;
          lastActionStack.push(id);
          save(); render();
        }else if(act==="edit"){
          el("edit-"+id).style.display = "block";
        }else if(act==="cancel"){
          el("edit-"+id).style.display = "none";
        }else if(act==="save"){
          const r = document.querySelector(`input[data-id="${id}"][data-k="route"]`).value.trim();
          const a = document.querySelector(`input[data-id="${id}"][data-k="address"]`).value.trim();
          it.route = r || "--";
          it.address = norm(a);
          el("edit-"+id).style.display = "none";
          save(); render();
        }
      }, { once:true });
    });
  }

  // -------- 顶部按钮：导航/复制下一条未送 --------
  el("btnNavNext").addEventListener("click", ()=>{
    const next = items.find(x=>!x.checked);
    if(!next) return alert("没有未送的了（都已勾选）。");
    next.checked = true;          // ✅ 自动勾选
    lastActionStack.push(next.id);
    save(); render();
    window.open(navUrlGoogle(next.address), "_blank");
  });

  el("btnCopyNext").addEventListener("click", async ()=>{
    const next = items.find(x=>!x.checked);
    if(!next) return alert("没有未送的了（都已勾选）。");
    await copyText(next.address);
    next.checked = true;          // ✅ 自动勾选
    lastActionStack.push(next.id);
    save(); render();
    alert("已复制并自动勾选。");
  });

  el("btnUndo").addEventListener("click", ()=>{
    const lastId = lastActionStack.pop();
    if(!lastId) return alert("没有可撤销的操作。");
    const it = items.find(x=>x.id===lastId);
    if(!it) return;
    it.checked = false;
    save(); render();
  });

  el("btnClear").addEventListener("click", ()=>{
    if(!confirm("确定清空全部数据？")) return;
    items = [];
    queue = [];
    processing = false;
    lastActionStack = [];
    save(); render();
  });

  // -------- 批量识别导入：两区 OCR（路线号区 + 地址区）--------
  async function processQueue(){
    if(processing) return;
    processing = true;
    render();

    let workerDigits = null;
    let workerAddr = null;

    try{
      workerDigits = await Tesseract.createWorker("eng");
      workerAddr = await Tesseract.createWorker("eng");

      // ✅ 路线号：只要数字 + 用“单词模式”更适合一个大数字（个位数更稳）
      await workerDigits.setParameters({
        tessedit_char_whitelist: "0123456789",
        preserve_interword_spaces: "1",
        tessedit_pageseg_mode: "8"
      });

      // 地址：允许常见字符
      await workerAddr.setParameters({
        tessedit_char_whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ,.-/#",
        preserve_interword_spaces: "1"
      });

      while(queue.length){
        const f = queue.shift();
        el("hint").innerHTML = `<span class="hint">识别中：${esc(f.name || "image")}（剩余 ${queue.length} 张）…</span>`;
        render();

        const routeFrac = parseFloat(el("routeW").value || "0.40");
        const defaultCity = (el("defaultCity").value || "Pittsburgh, PA").trim();

        const { canvas, width, height } = await preprocess(f);

        // 左侧路线号区
        const rBlob = await cropToBlob(canvas, 0, 0, width * routeFrac, height);

        // 右侧地址区（从 routeFrac 开始）
        const ax = Math.round(width * routeFrac);
        const aBlob = await cropToBlob(canvas, ax, 0, width - ax, height);

        const rRes = await workerDigits.recognize(rBlob);
        const aRes = await workerAddr.recognize(aBlob);

        const route = extractRoute((rRes.data && rRes.data.text) ? rRes.data.text : "");
        let addr = extractAddress((aRes.data && aRes.data.text) ? aRes.data.text : "");

        // 地址缺城市州：补默认城市
        if(addr && defaultCity){
          const hasState = /\b[A-Z]{2}\b/.test(addr);
          const hasCityState = /,\s*[A-Za-z]+\s*,?\s*[A-Z]{2}\b/.test(addr);
          if(!hasState && !hasCityState){
            addr = `${addr}, ${defaultCity}`;
          }
        }

        addItem(route, addr);
      }

      dedupe();
      save();
      el("hint").innerHTML = `<span class="hint" style="color:#0a7a2f;">导入完成 ✅（如果路线号是 --，点“修改”补这一条即可）</span>`;
      render();

    }catch(e){
      console.error(e);
      el("hint").innerHTML = `<span class="hint" style="color:#a40000;">识别失败：${esc(String(e))}</span>`;
      render();
    }finally{
      try{ if(workerDigits) await workerDigits.terminate(); }catch{}
      try{ if(workerAddr) await workerAddr.terminate(); }catch{}
      processing = false;
      render();
    }
  }

  el("btnImport").addEventListener("click", ()=>{
    const files = el("files").files;
    if(!files || !files.length) return alert("先选择截图（可多选，大概 6 张）。");
    queue = Array.from(files);
    processQueue();
  });

  // init
  load();
  render();
</script>
</body>
</html>
