<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>路线助手（纯列表最终版 + OCR）</title>

<!-- OCR：Tesseract.js（纯前端，不用服务器） -->
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e8e8ee;
    --blue:#1a73e8; --dark:#111; --muted:#666;
    --green:#1bbf5c; --red:#d93025;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial}
  .wrap{max-width:860px;margin:0 auto;padding:12px 12px 40px}

  h1{margin:8px 0 10px;font-size:26px;letter-spacing:.2px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
  textarea{
    width:100%;height:150px;border-radius:14px;border:1px solid var(--line);
    padding:12px;font-size:14px;line-height:1.35;background:#fff;resize:vertical;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
  button{
    border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:900;
    cursor:pointer;
  }
  button:active{transform:scale(.99)}
  .primary{background:var(--blue);color:#fff}
  .ghost{background:#fff;border:1px solid var(--line);color:#111}
  .danger{background:#fff;border:1px solid #ffd1d1;color:var(--red)}
  .disabled{opacity:.45;pointer-events:none}

  /* 统计栏：置顶随时可见 */
  .sticky{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(to bottom, rgba(246,247,249,.95), rgba(246,247,249,.70));
    padding:8px 0 10px;backdrop-filter:saturate(1.2) blur(6px);
  }
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;font-size:16px;font-weight:900;
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  }
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:900}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}

  /* 排序条 */
  .sortbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .sortbtn{background:#fff;border:1px solid var(--line);color:#111}
  .sortbtn.on{background:var(--dark);border-color:var(--dark);color:#fff}

  /* 搜索 */
  .search{
    width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;font-size:14px;background:#fff
  }

  /* 列表卡片 */
  .list{margin-top:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-top:10px;
  }
  .left{min-width:0;display:flex;gap:12px;align-items:flex-start}
  .no{
    background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;
    font-weight:1000;font-size:16px;line-height:1;
    box-shadow:0 8px 18px rgba(0,0,0,.18);
    flex:0 0 auto; min-width:78px; text-align:center;
  }
  .addr{font-size:15px;font-weight:900;line-height:1.25;word-break:break-word}
  .sub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
  .actions{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  .chk{width:22px;height:22px;transform:scale(1.15)}
  .navbtn{background:var(--blue);color:#fff;border-radius:14px;padding:12px 14px;font-weight:1000}
  .editbtn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:1000}
  .delivered{opacity:.45}

  /* OCR 进度条 */
  .ocrbox{
    margin-top:10px;
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;font-size:13px;color:#333;line-height:1.35
  }
  .bar{height:10px;background:#eee;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar > div{height:10px;background:var(--blue);width:0%}

  input[type="file"]{display:none}
</style>
</head>

<body>
<div class="wrap">
  <div class="sticky">
    <div class="stat" id="stat">📦 今日共 0 单 ｜ ✅ 已送 0 ｜ 🕒 剩余 0</div>
  </div>

  <h1>路线助手（纯列表最终版 + OCR）</h1>

  <div class="panel">
    <textarea id="input" placeholder="方式1：粘贴（每行：路线号 空格 地址）
例：
55 1112 Berkshire Ave, Pittsburgh, PA
56 1237 Berkshire Ave, Pittsburgh, PA

方式2：点【识别截图】最多9张（推荐）"></textarea>

    <div class="row">
      <button class="primary" id="btnBuild">生成列表</button>

      <label for="file" class="ghost" id="btnPick" style="display:inline-block;cursor:pointer;">
        📷 识别截图（最多9张）
      </label>
      <input id="file" type="file" accept="image/*" multiple />

      <button class="ghost" id="btnPaste">📋 从剪贴板粘贴</button>
      <button class="ghost" id="btnCopyAll">复制（带线路号）</button>
      <button class="ghost" id="btnCopyAddr">只复制地址</button>
      <button class="danger" id="btnClear">清空今天</button>
    </div>

    <div class="sortbar" id="sortbar">
      <button class="sortbtn" id="sortRaw">原始顺序</button>
      <button class="sortbtn on" id="sortAsc">线路号升序（默认）</button>
      <button class="sortbtn" id="sortDesc">线路号降序</button>
    </div>

    <input class="search" id="search" placeholder="搜索：输入路线号 / 街道 / 城市（例如 55 或 Berkshire）" />

    <div class="ocrbox" id="ocrBox" style="display:none;">
      <div id="ocrText">OCR 准备中…</div>
      <div class="bar"><div id="ocrBar"></div></div>
      <div class="hint" id="ocrHint"></div>
    </div>

    <div class="hint">
      ✅ 点“导航”会自动✅已送，并跳转 Google Maps。<br/>
      ✅ 每天路线号不一样没关系：系统按“今天”独立保存（明天自动是新的一天）。<br/>
      ✅ OCR 的识别逻辑：只认 <b>“路线号/线路号”</b>旁边的 1–4 位数字 + 该卡片里出现的地址（门牌号 + 街道名）。识别不准可点 ✏️ 手动改一条。
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
/* =========================
   存储：每天独立
========================= */
function todayKey(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const K_INPUT = "rn2:input:"+todayKey();
const K_DONE  = "rn2:done:"+todayKey();
const K_SORT  = "rn2:sort";     // raw / asc / desc
const K_LASTOCR = "rn2:lastocr:"+todayKey();

let doneSet = new Set(JSON.parse(localStorage.getItem(K_DONE) || "[]"));
let sortMode = localStorage.getItem(K_SORT) || "asc";

/* =========================
   数据结构
========================= */
let orders = []; // {id, noStr, noNum, addr, done}

/* =========================
   DOM
========================= */
const elInput  = document.getElementById('input');
const elList   = document.getElementById('list');
const elStat   = document.getElementById('stat');
const elSearch = document.getElementById('search');
const elFile   = document.getElementById('file');

const elOcrBox  = document.getElementById('ocrBox');
const elOcrText = document.getElementById('ocrText');
const elOcrBar  = document.getElementById('ocrBar');
const elOcrHint = document.getElementById('ocrHint');

/* restore input */
elInput.value = localStorage.getItem(K_INPUT) || "";
elInput.addEventListener('input', ()=> localStorage.setItem(K_INPUT, elInput.value));

document.getElementById('btnBuild').onclick = buildListFromText;
document.getElementById('btnClear').onclick = clearToday;
document.getElementById('btnCopyAll').onclick = ()=>copyText(makeCopyText(true));
document.getElementById('btnCopyAddr').onclick = ()=>copyText(makeCopyText(false));
document.getElementById('btnPaste').onclick = pasteFromClipboard;

document.getElementById('sortRaw').onclick  = ()=>setSort("raw");
document.getElementById('sortAsc').onclick  = ()=>setSort("asc");
document.getElementById('sortDesc').onclick = ()=>setSort("desc");

elSearch.addEventListener('input', renderList);

elFile.addEventListener('change', async ()=>{
  const files = Array.from(elFile.files || []);
  if(!files.length) return;
  if(files.length > 9){
    alert("最多只能选 9 张图。你这次选了 "+files.length+" 张，请少选一点。");
    elFile.value = "";
    return;
  }
  await ocrImages(files);
  elFile.value = "";
});

/* =========================
   解析：粘贴文本（每行：号 空格 地址）
========================= */
function parseLines(text){
  const lines = String(text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  let auto = 1;
  for(const line of lines){
    // 支持：NO.55 / 55, / 55 空格 / 055
    const m = line.match(/^(?:NO\.?\s*)?(\d{1,4})[,\s，]+(.+)$/i);
    if(m){
      out.push({noStr:m[1].replace(/^0+(?=\d)/,''), addr:m[2].trim()});
    }else{
      // 没有号：给 A001
      const noStr = "A"+String(auto++).padStart(3,'0');
      out.push({noStr, addr:line});
    }
  }
  return out;
}

/* =========================
   排序
========================= */
function setSort(mode){
  sortMode = mode;
  localStorage.setItem(K_SORT, sortMode);
  document.getElementById('sortRaw').classList.toggle('on', sortMode==="raw");
  document.getElementById('sortAsc').classList.toggle('on', sortMode==="asc");
  document.getElementById('sortDesc').classList.toggle('on', sortMode==="desc");
  renderAll();
}
function noToNum(noStr){
  const n = parseInt(noStr,10);
  return Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER;
}
function sortOrders(arr){
  const a = arr.slice();
  if(sortMode==="raw") return a; // 原始输入顺序
  a.sort((x,y)=>{
    const xn = noToNum(x.noStr), yn = noToNum(y.noStr);
    return sortMode==="asc" ? (xn-yn) : (yn-xn);
  });
  return a;
}

/* =========================
   构建列表（从文本）
========================= */
function buildListFromText(){
  const parsed = parseLines(elInput.value || "");
  orders = parsed.map(p=>{
    const id = p.noStr + "||" + p.addr;
    return {
      id,
      noStr: p.noStr,
      addr: normalizeAddr(p.addr),
      done: doneSet.has(id),
    };
  });
  saveDone(); // 同步一下
  renderAll();
}

/* =========================
   统计
========================= */
function renderStat(){
  const total = orders.length;
  const sent = orders.filter(o=>o.done).length;
  elStat.textContent = `📦 今日共 ${total} 单 ｜ ✅ 已送 ${sent} ｜ 🕒 剩余 ${total - sent}`;
}

/* =========================
   列表渲染
========================= */
function renderList(){
  elList.innerHTML = "";
  const q = (elSearch.value || "").trim().toLowerCase();
  let view = sortOrders(orders);
  if(q){
    view = view.filter(o => (o.noStr+" "+o.addr).toLowerCase().includes(q));
  }
  view.forEach(o=>{
    const card = document.createElement('div');
    card.className = "card" + (o.done ? " delivered" : "");
    card.innerHTML = `
      <div class="left">
        <div class="no">NO.${escapeHtml(o.noStr)}</div>
        <div style="min-width:0">
          <div class="addr">${escapeHtml(o.addr)}</div>
          <div class="sub">点导航自动✅｜可手动改｜可原始/升序/降序</div>
        </div>
      </div>
      <div class="actions">
        <button class="editbtn" title="手动修改">✏️</button>
        <input class="chk" type="checkbox" ${o.done?"checked":""} />
        <button class="navbtn">▶ 导航</button>
      </div>
    `;

    // 手动改
    card.querySelector('.editbtn').addEventListener('click', ()=>{
      const newNo = prompt("修改路线号（1-4位数字）", o.noStr);
      if(newNo===null) return;
      const nn = String(newNo).trim();
      if(!/^\d{1,4}$/.test(nn)){
        alert("路线号只能是 1-4 位数字。");
        return;
      }
      const newAddr = prompt("修改地址（建议：门牌号 + 街道名 + 城市州）", o.addr);
      if(newAddr===null) return;

      // 更新 id（避免已送状态丢失：把 done 也迁移）
      const wasDone = o.done;
      doneSet.delete(o.id);

      o.noStr = nn.replace(/^0+(?=\d)/,'');
      o.addr  = normalizeAddr(String(newAddr).trim());
      o.id = o.noStr + "||" + o.addr;

      o.done = wasDone;
      if(o.done) doneSet.add(o.id);
      saveDone();
      renderAll();
    });

    // 勾选
    card.querySelector('input').addEventListener('change', (e)=>{
      o.done = e.target.checked;
      if(o.done) doneSet.add(o.id);
      else doneSet.delete(o.id);
      saveDone();
      renderAll();
    });

    // 导航
    card.querySelector('.navbtn').addEventListener('click', ()=>{
      startNav(o);
    });

    elList.appendChild(card);
  });
}

function renderAll(){
  renderStat();
  renderList();
}

/* =========================
   已送存储
========================= */
function saveDone(){
  localStorage.setItem(K_DONE, JSON.stringify([...doneSet]));
}

/* =========================
   导航：Google Maps（自动✅）
========================= */
function startNav(o){
  if(!o.done){
    o.done = true;
    doneSet.add(o.id);
    saveDone();
    renderAll();
  }
  const url = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(o.addr) + "&travelmode=driving";
  window.location.href = url;
}

/* =========================
   复制
========================= */
function makeCopyText(withNo){
  const view = sortOrders(orders);
  if(withNo) return view.map(o=>`${o.noStr} ${o.addr}`).join("\n");
  return view.map(o=>o.addr).join("\n");
}
async function copyText(txt){
  try{
    await navigator.clipboard.writeText(txt);
    alert("已复制 ✅");
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert("已复制 ✅");
  }
}
async function pasteFromClipboard(){
  try{
    const t = await navigator.clipboard.readText();
    if(!t) return alert("剪贴板是空的。");
    elInput.value = (elInput.value ? (elInput.value.trimEnd()+"\n") : "") + t.trim();
    localStorage.setItem(K_INPUT, elInput.value);
    alert("已从剪贴板粘贴 ✅");
  }catch(e){
    alert("无法读取剪贴板（iPhone 需要你手动允许）。你也可以直接长按文本框粘贴。");
  }
}

/* =========================
   清空今天
========================= */
function clearToday(){
  if(!confirm("确定清空今天的输入/已送记录吗？")) return;
  orders = [];
  doneSet = new Set();
  elInput.value = "";
  elSearch.value = "";
  localStorage.removeItem(K_INPUT);
  localStorage.removeItem(K_DONE);
  localStorage.removeItem(K_LASTOCR);
  renderAll();
}

/* =========================
   OCR：核心（最多9张）
   思路：按“路线号/线路号”字段抓 1-4位数字 + 同卡片内地址
========================= */

function showOCRBox(show){
  elOcrBox.style.display = show ? "block" : "none";
}
function setOCRProgress(p, text, hint){
  elOcrBar.style.width = Math.max(0, Math.min(100, p)) + "%";
  if(text) elOcrText.textContent = text;
  if(hint!=null) elOcrHint.textContent = hint;
}

/* 预处理：让深色界面更好识别（转灰度 + 提升对比） */
async function preprocessImageToDataURL(file){
  const img = await loadImage(file);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});

  // 适当缩放：太大很慢；太小识别差。目标宽 1400 左右
  const maxW = 1400;
  let w = img.naturalWidth, h = img.naturalHeight;
  if(w > maxW){
    const s = maxW / w;
    w = Math.round(w*s); h = Math.round(h*s);
  }
  canvas.width = w; canvas.height = h;
  ctx.drawImage(img, 0, 0, w, h);

  const im = ctx.getImageData(0,0,w,h);
  const d = im.data;

  // 计算平均亮度，判断是否深色背景
  let sum=0;
  for(let i=0;i<d.length;i+=4){
    const y = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
    sum += y;
  }
  const avg = sum / (d.length/4);
  const isDarkUI = avg < 120; // 深色界面大概率

  for(let i=0;i<d.length;i+=4){
    let r=d[i], g=d[i+1], b=d[i+2];
    // 灰度
    let y = r*0.299 + g*0.587 + b*0.114;

    // 深色界面：反相（白字变黑字）
    if(isDarkUI) y = 255 - y;

    // 提升对比：简单阈值 + 拉伸
    // 让文字更“黑”
    y = y < 160 ? y*0.6 : y*1.15;
    y = Math.max(0, Math.min(255, y));

    d[i]=d[i+1]=d[i+2]=y;
  }
  ctx.putImageData(im,0,0);
  return canvas.toDataURL('image/png');
}

function loadImage(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

/* OCR 主流程 */
async function ocrImages(files){
  showOCRBox(true);
  setOCRProgress(2, "OCR 开始…", "提示：第一次会加载识别引擎，可能稍慢。");

  const allPairs = [];
  let total = files.length;
  for(let i=0;i<files.length;i++){
    const file = files[i];
    setOCRProgress(5 + (i/total)*60, `OCR 第 ${i+1}/${total} 张：预处理中…`, "");

    const dataUrl = await preprocessImageToDataURL(file);

    setOCRProgress(8 + (i/total)*60, `OCR 第 ${i+1}/${total} 张：识别中…`, "尽量用“配送中列表”的截图（像你图二那种）。");

    // OCR：中英文混合（路线号是中文，地址英文）
    const ret = await Tesseract.recognize(
      dataUrl,
      'eng+chi_sim',
      {
        logger: m=>{
          // m.progress 0~1
          if(m && typeof m.progress==="number"){
            const base = 10 + (i/total)*70;
            const span = 70/total;
            const p = base + m.progress*span;
            setOCRProgress(p, `OCR 第 ${i+1}/${total} 张：识别中…`, `识别进度 ${(m.progress*100).toFixed(0)}%`);
          }
        }
      }
    );

    const rawText = (ret && ret.data && ret.data.text) ? ret.data.text : "";
    const pairs = extractPairsFromOCR(rawText);
    pairs.forEach(p=>allPairs.push(p));

    setOCRProgress(15 + ((i+1)/total)*75, `OCR 第 ${i+1}/${total} 张完成：提取到 ${pairs.length} 条`, "");
  }

  // 去重（同号同地址）
  const uniq = new Map();
  for(const p of allPairs){
    const k = p.noStr+"||"+p.addr;
    if(!uniq.has(k)) uniq.set(k,p);
  }
  const finalPairs = Array.from(uniq.values());

  if(!finalPairs.length){
    setOCRProgress(100, "没有识别到有效的“路线号 + 地址”。", "建议：截图时确保卡片里能看到“路线号”字样 + 地址行。");
    alert("没有识别到有效的“路线号 + 地址”。\n\n建议：\n1) 用你图二那种“配送中列表”截图\n2) 一屏不要太糊/太小\n3) 卡片里要能看到“路线号”字样 + 地址行");
    return;
  }

  // 写入输入框（按识别顺序写入；生成列表后再按排序显示）
  const lines = finalPairs.map(p=>`${p.noStr} ${p.addr}`).join("\n");
  elInput.value = lines;
  localStorage.setItem(K_INPUT, elInput.value);
  localStorage.setItem(K_LASTOCR, lines);

  setOCRProgress(100, `OCR 完成 ✅ 提取到 ${finalPairs.length} 条（可手动✏️改）`, "现在点【生成列表】就行。");
  alert(`OCR 完成 ✅ 提取到 ${finalPairs.length} 条。\n\n下一步：点【生成列表】。`);

  // 自动生成
  buildListFromText();
}

/* =========================
   从 OCR 文本提取（关键）
   只认：路线号/线路号 + 1-4位数字，地址认英文街道格式
========================= */
function extractPairsFromOCR(text){
  const t = normalizeOCR(text);

  // 统一换行，便于“附近窗口”提取
  const lines = t.split("\n").map(s=>s.trim()).filter(Boolean);

  // 把所有行拼成带索引的字符串，便于窗口截取
  // 同时保留一个大串，处理被 OCR 拆碎的情况
  const big = lines.join("\n");

  const out = [];

  // 1) 先找“路线号/线路号”出现的位置
  // 可能是：路线号、路 线 号、线路号、线 路 号
  const reTag = /(路\s*线\s*号|线\s*路\s*号|线\s*程\s*号|路线号|线路号)/g;
  let m;
  while((m = reTag.exec(big)) !== null){
    const idx = m.index;

    // 向前找最近的 1-4 位数字（路线号）
    const left = big.slice(Math.max(0, idx-60), idx);
    const noMatch = left.match(/(\d{1,4})\s*$/);
    if(!noMatch) continue;
    const noStr = noMatch[1].replace(/^0+(?=\d)/,'');

    // 向后取一段窗口找地址
    const right = big.slice(idx, Math.min(big.length, idx+260));

    const addr = findAddressInWindow(right);
    if(!addr) continue;

    out.push({noStr, addr: normalizeAddr(addr)});
  }

  // 2) 兜底：有些 OCR 把“路线号”漏了，但结构是：大数字行 + 地址行
  // 只在 out 为空或很少时启用，避免误抓门牌号
  if(out.length < 2){
    for(let i=0;i<lines.length-1;i++){
      const a = lines[i], b = lines[i+1], c = lines[i+2] || "";
      // a 是 1-4 位数字，b/c 里出现街道
      if(/^\d{1,4}$/.test(a)){
        const win = (b+"\n"+c);
        const addr = findAddressInWindow(win);
        if(addr){
          // 避免把门牌号当路线号：如果地址也以同样数字开头，就跳过
          if(new RegExp("^\\s*"+a+"\\b").test(addr.trim())) continue;
          out.push({noStr:a.replace(/^0+(?=\d)/,''), addr: normalizeAddr(addr)});
        }
      }
    }
  }

  // 去重
  const uniq = new Map();
  for(const p of out){
    const k = p.noStr+"||"+p.addr;
    if(!uniq.has(k)) uniq.set(k,p);
  }
  return Array.from(uniq.values());
}

function normalizeOCR(s){
  let t = String(s||"");

  // 常见 OCR 噪音：把奇怪符号变空格
  t = t.replace(/[|•·”“‘’]/g," ");
  t = t.replace(/[，]/g,",");
  t = t.replace(/\u00A0/g," "); // nbsp
  t = t.replace(/[^\S\r\n]+/g," "); // 多空格
  // 把一些可能被拆开的中文拼回来（尽量）
  t = t.replace(/路\s*线\s*号/g,"路线号");
  t = t.replace(/线\s*路\s*号/g,"线路号");
  t = t.replace(/\r/g,"\n");
  // 连续空行压缩
  t = t.replace(/\n{3,}/g,"\n\n");
  return t.trim();
}

function findAddressInWindow(winText){
  const w = String(winText||"");

  // 地址特征：门牌号 + 英文街道 + 类型
  // 街道类型覆盖你常见的：St, Street, Ave, Avenue, Rd, Road, Dr, Drive, Ln, Lane, Blvd, Way, Ct, Court, Pl, Place, Cir, Circle, Pkwy, Pike, Ter, Terrace
  const re = /(\d{2,6}\s+[A-Za-z0-9.\-'\s]{2,40}\s+(?:St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Ln|Lane|Blvd|Boulevard|Way|Ct|Court|Pl|Place|Cir|Circle|Pkwy|Parkway|Pike|Ter|Terrace)\b[^ \n]{0,80})/i;

  // 有些 OCR 会把逗号弄丢：允许后面跟 Pittsburgh / PA / ZIP
  const m = w.match(re);
  if(!m) return null;

  // 把后面可能的 “Pittsburgh PA 15205” 补进来（最多再吃 60 字符）
  let addr = m[1];

  // 尝试补充城市州：从匹配结束处往后抓一小段
  const start = m.index + m[0].length;
  const tail = w.slice(start, start+80);
  // 如果 tail 里有 Pittsburgh 或 PA 就拼进去（去掉多余换行）
  const tailClean = tail.replace(/\n/g," ").replace(/\s+/g," ").trim();
  if(/Pittsburgh/i.test(tailClean) || /\bPA\b/i.test(tailClean)){
    // 防止拼太多垃圾：只拿到第一个明显的句子结束
    const cut = tailClean.split(/(?:(?:Suspected)|(?:UUS)|(?:202\d)|(?:英里)|(?:mile))/i)[0].trim();
    if(cut && cut.length <= 60){
      addr = (addr + " " + cut).trim();
    }
  }

  return addr;
}

function normalizeAddr(a){
  let s = String(a||"").trim();

  // 修正常见：多空格、逗号前空格、大小写乱
  s = s.replace(/\s+/g," ");
  s = s.replace(/\s+,/g,",");
  s = s.replace(/,\s*/g,", ");
  s = s.replace(/\s+PA\b/i," PA");
  s = s.replace(/\s+Pittsburgh\b/i," Pittsburgh");
  // 去掉尾巴明显噪音
  s = s.replace(/\bSuspected\b.*$/i,"").trim();
  s = s.replace(/\bUUS[A-Z0-9]+\b.*$/i,"").trim();
  s = s.replace(/\b202\d[-/]\d{2}[-/]\d{2}\b.*$/i,"").trim();

  return s;
}

  document.getElementById('sortRaw').classList.toggle('on', sortMode==="raw");
  document.getElementById('sortAsc').classList.toggle('on', sortMode==="asc");

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
