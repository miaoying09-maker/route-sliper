<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UniUni 批量截图识别（Google Maps / 自动勾选 / 简洁版）</title>
  <style>
    :root { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
    body { margin:0; background:#f6f7fb; color:#111; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
    .sticky{
      position: sticky; top:0; z-index:10;
      background: rgba(246,247,251,.96);
      backdrop-filter: blur(10px);
      border-bottom:1px solid #e6e8ef;
      padding:10px 12px;
      margin:-12px -12px 12px -12px;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{
      border:1px solid #d5d9e6; background:#fff;
      padding:11px 12px; border-radius: 14px; cursor:pointer;
      font-size:14px; line-height:1;
    }
    .btn.primary{ background:#111; color:#fff; border-color:#111; }
    .btn.danger{ background:#fff3f3; border-color:#ffd3d3; color:#a40000; }
    .btn:disabled{ opacity:.5; cursor:not-allowed; }
    .card{
      background:#fff; border:1px solid #e6e8ef; border-radius: 16px;
      padding:12px; box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .hint{ font-size:12px; color:#666; }
    .pill{ font-size:12px; padding:3px 8px; border-radius:999px; border:1px solid #e6e8ef; background:#fafbff; }
    .stat{ font-size:13px; color:#333; display:flex; gap:10px; flex-wrap:wrap; }
    .progress{ height:8px; background:#e9ecf7; border-radius:999px; overflow:hidden; margin-top:8px; }
    .bar{ height:100%; width:0%; background:#111; transition: width .2s; }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .item{
      display:grid; grid-template-columns: 92px 1fr; gap:10px; align-items:stretch;
      border:1px solid #e6e8ef; border-radius:16px; padding:10px; background:#fff;
    }
    .routeBox{
      border-radius:14px; border:1px solid #e6e8ef; background:#fafbff;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:8px;
    }
    .routeNum{ font-size:40px; font-weight:900; line-height:1; }
    .routeTxt{ font-size:12px; color:#666; margin-top:6px; }
    .addr{ font-size:15px; line-height:1.35; margin-top:4px; }
    .meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .small{ font-size:12px; color:#666; margin-top:6px; }
    textarea{ width:100%; box-sizing:border-box; border:1px solid #d5d9e6; border-radius:14px; padding:10px; font-size:14px; min-height:110px; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="sticky">
    <div class="row">
      <button class="btn primary" id="btnNavNext">Google导航下一条未送（自动勾选）</button>
      <button class="btn" id="btnCopyNext">复制下一条未送（自动勾选）</button>
      <button class="btn danger" id="btnClear">清空</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <div class="stat" id="statLine"></div>
      <span class="pill" id="jobLine">待处理：0</span>
    </div>
    <div class="progress"><div class="bar" id="progBar"></div></div>

    <div class="hint" style="margin-top:8px;">
      用法（iPhone）：点“选择截图（可多选，约6张）” → 点“批量识别导入” → 送单时只点最上面的“Google导航下一条未送”。<br>
      每点一次：打开 Google Maps 导航 + 这条自动变 ✅ 已送
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div style="font-weight:900;">批量导入（更准 OCR）</div>
      <span class="pill">Google Maps 默认</span>
    </div>

    <div class="row" style="margin-top:10px;">
      <input type="file" id="fileImgs" accept="image/*" multiple />
      <button class="btn primary" id="btnRunOcr">批量识别导入</button>
      <button class="btn" id="btnDedupe">去重</button>
    </div>

    <div class="hint" id="ocrHint" style="margin-top:10px;"></div>

    <details style="margin-top:12px;">
      <summary style="cursor:pointer; font-weight:800;">备用：粘贴文本再解析（可选）</summary>
      <div class="hint" style="margin-top:8px;">如果某一张识别乱了，把 OCR 文本粘贴进来也能解析。</div>
      <textarea id="txtRaw" placeholder="粘贴 OCR 文本（可选）"></textarea>
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" id="btnParseText">解析导入</button>
      </div>
    </details>
  </div>

  <div class="list" id="list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
  const LS_KEY = "uniuni_google_batch_v1";

  let items = []; // {id, checked, route, tracking, address, createdAt, usedAt?}
  let queue = [];
  let processing = false;

  const el = id => document.getElementById(id);
  const listEl = el("list");
  const statEl = el("statLine");
  const progEl = el("progBar");
  const jobEl = el("jobLine");

  function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
  function save(){ localStorage.setItem(LS_KEY, JSON.stringify(items)); }
  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      items = raw ? JSON.parse(raw) : [];
    }catch{ items = []; }
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function normalizeAddress(s){
    return (s||"").replace(/\s+/g," ").replace(/\s*,\s*/g,", ").trim();
  }
  function looksLikeAddress(line){
    const s = (line||"").trim();
    if (s.length < 8) return false;
    const hasNumber = /\b\d{1,6}\b/.test(s);
    const hasStreet = /\b(st|street|ave|avenue|rd|road|blvd|boulevard|dr|drive|ln|lane|way|ct|court|pl|place|pkwy|parkway|hwy|highway|cir|circle|trl|trail)\b/i.test(s);
    const hasCityStateZip = /\bPittsburgh\b.*\bPA\b/i.test(s) || /\b[A-Z]{2}\s*\d{5}(-\d{4})?\b/.test(s);
    return hasNumber && (hasStreet || hasCityStateZip);
  }

  // Google Maps 单点导航（iPhone 也能打开 Google Maps App 或网页）
  function navUrlGoogle(dest){
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
  }

  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); }
    catch{
      const ta=document.createElement("textarea");
      ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }
  }

  // ===== 更准：OCR 前预处理（放大 + 灰度 + 对比 + 二值化）=====
  async function preprocessImageToBlob(fileOrBlob){
    const blob = fileOrBlob;
    const img = new Image();
    img.decoding = "async";
    const url = URL.createObjectURL(blob);
    img.src = url;
    await img.decode();
    URL.revokeObjectURL(url);

    // 放大一点（对 UniUni 白底黑字更准）
    const scale = Math.min(2.2, Math.max(1.4, 1700 / Math.max(img.width, img.height)));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);

    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently:true });

    ctx.drawImage(img, 0, 0, w, h);

    const im = ctx.getImageData(0,0,w,h);
    const d = im.data;

    const contrast = 1.38;
    for(let i=0;i<d.length;i+=4){
      const r=d[i], g=d[i+1], b=d[i+2];
      let gray = (0.299*r + 0.587*g + 0.114*b);
      gray = (gray - 128) * contrast + 128;
      d[i]=d[i+1]=d[i+2]=gray;
    }

    // 阈值：抽样估计平均亮度，阈值略偏低让字更黑
    let sum=0,cnt=0;
    for(let i=0;i<d.length;i+=48*4){ sum += d[i]; cnt++; }
    const avg = sum / Math.max(1,cnt);
    const thr = Math.max(108, Math.min(178, avg - 12));

    for(let i=0;i<d.length;i+=4){
      const v=d[i];
      const bw = v < thr ? 0 : 255;
      d[i]=d[i+1]=d[i+2]=bw;
    }
    ctx.putImageData(im,0,0);

    return await new Promise(res => canvas.toBlob(res, "image/png", 1.0));
  }

  // ===== 按 UUS 分组，提取 route + tracking + address =====
  function parseUniUniFromText(raw){
    const lines = (raw||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

    const idxs = [];
    for(let i=0;i<lines.length;i++){
      if(/^UUS[0-9A-Z]{10,}$/i.test(lines[i])) idxs.push(i);
    }
    if(!idxs.length) return [];

    const blocks = [];
    for(let b=0;b<idxs.length;b++){
      const s = idxs[b];
      const e = (b+1<idxs.length)? idxs[b+1] : lines.length;
      blocks.push(lines.slice(s,e));
    }

    const out = [];
    for(const blk of blocks){
      const text = blk.join(" ");
      const tracking = (blk.find(l=>/^UUS[0-9A-Z]{10,}$/i.test(l))||"").toUpperCase();

      // 路线号：优先抓“单独一行三位数”
      let route = "";
      const routeLine = blk.find(l => /^\d{3}$/.test(l));
      if(routeLine) route = routeLine;
      if(!route){
        const m = text.match(/\b(1\d{2}|[2-9]\d{2})\b/);
        if(m) route = m[1];
      }

      // 地址：找最像地址的行 + 合并下一行 city/state
      const cand = blk.filter(looksLikeAddress);
      let addr = cand[0] || "";

      if(addr){
        const i = blk.indexOf(addr);
        const next = blk[i+1] || "";
        const isCity = /\bPittsburgh\b.*\bPA\b/i.test(next) || /\b[A-Z]{2}\s*\d{5}/.test(next);
        if(isCity && !/\bPA\b/i.test(addr) && next.length <= 60){
          addr = `${addr}, ${next}`;
        }
      }else{
        const l2 = blk.find(l => /\b\d{1,6}\b/.test(l) && l.length >= 10);
        if(l2) addr = l2;
      }

      addr = normalizeAddress(addr);
      if(addr){
        out.push({ route, tracking, address: addr });
      }
    }
    return out;
  }

  function addParsed(parsed, source){
    const now = Date.now();
    const newOnes = parsed.map(p => ({
      id: uid(),
      checked: false, // 默认未送，适合你按“导航下一条未送”顺着点
      route: p.route || "",
      tracking: p.tracking || "",
      address: normalizeAddress(p.address),
      source,
      createdAt: now
    })).filter(x => x.address);

    items = newOnes.concat(items);
    save();
    render();
  }

  function dedupe(){
    const seen = new Set();
    const out = [];
    for(const it of items){
      const key = (it.route+"|"+it.tracking+"|"+it.address).toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(it);
    }
    items = out;
    save();
    render();
  }

  function render(){
    const total = items.length;
    const done = items.filter(x=>x.checked).length;
    const todo = total - done;

    statEl.innerHTML = `
      <span class="pill">总数：<b>${total}</b></span>
      <span class="pill">未送：<b>${todo}</b></span>
      <span class="pill">已送：<b>${done}</b></span>
    `;
    progEl.style.width = total ? Math.round(done/total*100) + "%" : "0%";
    jobEl.textContent = `待处理：${queue.length}${processing ? "（识别中）" : ""}`;

    listEl.innerHTML = "";
    if(!items.length){
      listEl.innerHTML = `<div class="card"><div class="hint">还没有导入数据。先选择 6 张左右 UniUni 截图 → 点“批量识别导入”。</div></div>`;
      return;
    }

    for(const it of items){
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="routeBox">
          <div class="routeNum">${escapeHtml(it.route || "--")}</div>
          <div class="routeTxt">路线号</div>
        </div>
        <div>
          <div class="meta">
            <span class="pill">${it.checked ? "✅ 已送" : "⬜ 未送"}</span>
            ${it.tracking ? `<span class="pill">${escapeHtml(it.tracking)}</span>` : ""}
            <button class="btn primary" data-act="nav" data-id="${it.id}">导航（自动勾选）</button>
            <button class="btn" data-act="copy" data-id="${it.id}">复制地址</button>
            <button class="btn" data-act="toggle" data-id="${it.id}">${it.checked ? "取消勾选" : "手动勾选"}</button>
          </div>
          <div class="addr">${escapeHtml(it.address)}</div>
          <div class="small">建议：你主要用顶部“Google导航下一条未送”顺着送。</div>
        </div>
      `;
      listEl.appendChild(div);
    }

    listEl.querySelectorAll("button[data-act]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const act = btn.getAttribute("data-act");
        const id = btn.getAttribute("data-id");
        const it = items.find(x=>x.id===id);
        if(!it) return;

        if(act==="nav"){
          const url = navUrlGoogle(it.address);
          it.checked = true; // 导航后自动勾选 ✅
          it.usedAt = Date.now();
          save(); render();
          window.open(url, "_blank");
        }else if(act==="copy"){
          await copyText(it.address);
        }else if(act==="toggle"){
          it.checked = !it.checked;
          save(); render();
        }
      }, { once:true });
    });
  }

  // ===== 顶部快捷按钮 =====
  el("btnNavNext").addEventListener("click", ()=>{
    const next = items.find(x=>!x.checked);
    if(!next) return alert("没有未送的了（都已勾选）。");
    const url = navUrlGoogle(next.address);
    next.checked = true; // 导航后自动勾选 ✅
    next.usedAt = Date.now();
    save(); render();
    window.open(url, "_blank");
  });

  el("btnCopyNext").addEventListener("click", async ()=>{
    const next = items.find(x=>!x.checked);
    if(!next) return alert("没有未送的了（都已勾选）。");
    await copyText(next.address);
    next.checked = true; // 复制后也自动勾选（你送单更省事）
    next.usedAt = Date.now();
    save(); render();
    alert("已复制下一条未送，并自动勾选。");
  });

  el("btnClear").addEventListener("click", ()=>{
    if(!confirm("确定清空全部数据？")) return;
    items = [];
    queue = [];
    processing = false;
    save();
    el("txtRaw").value = "";
    render();
  });

  el("btnDedupe").addEventListener("click", ()=>dedupe());

  // ===== 批量 OCR 队列处理 =====
  async function processQueue(){
    if(processing) return;
    processing = true;
    render();

    // 复用一个 worker（比每张创建/销毁更快）
    let worker = null;
    try{
      worker = await Tesseract.createWorker("eng");
      while(queue.length){
        const f = queue.shift();
        el("ocrHint").innerHTML = `<span class="hint">识别中：${escapeHtml(f.name || "image")}（剩余 ${queue.length} 张）…</span>`;
        render();

        const pre = await preprocessImageToBlob(f);
        const { data } = await worker.recognize(pre);
        const text = (data && data.text) ? data.text : "";

        // 解析并导入
        const parsed = parseUniUniFromText(text);
        if(parsed.length){
          addParsed(parsed, "OCR");
        }else{
          // 失败就把文本放到备用框，方便你手动清理后解析
          el("txtRaw").value = (el("txtRaw").value ? (el("txtRaw").value + "\n\n") : "") + text.trim();
        }
      }
      el("ocrHint").innerHTML = `<span class="hint" style="color:#0a7a2f;">批量识别完成 ✅（如果有少量没识别到的，已把 OCR 文本放到“备用文本框”里）</span>`;
    }catch(e){
      console.error(e);
      el("ocrHint").innerHTML = `<span class="hint" style="color:#a40000;">OCR 失败：${escapeHtml(String(e))}</span>`;
    }finally{
      try{ if(worker) await worker.terminate(); }catch{}
      processing = false;
      render();
    }
  }

  el("btnRunOcr").addEventListener("click", ()=>{
    const files = el("fileImgs").files;
    if(!files || !files.length) return alert("先选择截图（可多选，大概 6 张）。");
    queue = Array.from(files);
    processQueue();
  });

  // 备用：解析文本
  el("btnParseText").addEventListener("click", ()=>{
    const raw = el("txtRaw").value || "";
    const parsed = parseUniUniFromText(raw);
    if(!parsed.length) return alert("没解析到 UUS 分组/地址。你可以把 UUS 开头的行和地址行保留再试。");
    addParsed(parsed, "TEXT");
  });

  // init
  load();
  render();
</script>
</body>
</html>
