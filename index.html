<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>路线助手（OCR｜导航｜已送｜按线路号排序）</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e8e8ee;
    --blue:#1a73e8; --dark:#111; --muted:#666;
    --green:#1bbf5c; --red:#c62828;
  }
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial}
  .wrap{max-width:900px;margin:0 auto;padding:12px;padding-bottom:28px}
  h2{margin:10px 0 10px;font-size:24px}

  /* ✅ 统计栏：永远可见 */
  .sticky{
    position:sticky; top:0; z-index:99999;
    background:linear-gradient(#f6f7f9 70%, rgba(246,247,249,0));
    padding-top:8px;
  }
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;
    font-size:16px;font-weight:1000;display:flex;gap:12px;flex-wrap:wrap;align-items:center
  }

  textarea{
    width:100%;height:140px;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);
    padding:12px;font-size:14px;line-height:1.35;background:#fff
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
  button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900}
  button:disabled{opacity:.6}
  .primary{background:var(--blue);color:#fff}
  .ghost{background:#fff;border:1px solid var(--line);color:#111}
  .danger{background:#fff;border:1px solid #ffb3b3;color:var(--red)}
  .small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}

  .search{
    width:100%;box-sizing:border-box;margin-top:10px;
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;background:#fff
  }
  .progress{
    margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;font-size:13px;color:#333;line-height:1.35;display:none
  }

  /* 排序栏 */
  .sortbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .sortbtn{background:#fff;border:1px solid var(--line);color:#111}
  .sortbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}

  .list{margin-top:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-top:10px;
  }
  .left{min-width:0;display:flex;gap:12px;align-items:flex-start}
  .no{
    background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;
    font-weight:1000;font-size:16px;line-height:1;flex:0 0 auto;
    min-width:76px;text-align:center;
  }
  .addr{font-size:15px;font-weight:900;line-height:1.25;word-break:break-word}
  .sub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
  .actions{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  .chk{width:22px;height:22px;transform:scale(1.15)}
  .navbtn{background:var(--blue);color:#fff;border-radius:14px;padding:12px 14px;font-weight:1000}
  .editbtn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px;font-weight:1000}
  .delivered{opacity:.45}
</style>
</head>

<body>
<div class="wrap">

  <div class="sticky">
    <div class="stat" id="stat">📦 今日共 0 单 ｜ ✅ 已送 0 ｜ 🕒 剩余 0</div>

    <!-- ✅ 排序：默认按线路号升序 -->
    <div class="sortbar">
      <button class="sortbtn" id="modeRaw">原始顺序</button>
      <button class="sortbtn on" id="modeAsc">线路号升序（默认）</button>
      <button class="sortbtn" id="modeDesc">线路号降序</button>
    </div>
  </div>

  <h2>路线助手（按线路号本身排序）</h2>

  <textarea id="input" placeholder="方式1：粘贴（每行：线路号 空格 地址）
例：
805 516 Lorenz Ave, Pittsburgh, PA

方式2：点【识别截图】最多9张（会自动按线路号排序显示）"></textarea>

  <div class="row">
    <button class="primary" id="btnBuild">生成列表</button>

    <label class="ghost" style="display:inline-flex;align-items:center;gap:10px;font-weight:900;padding:12px 16px;border-radius:14px;cursor:pointer;">
      📷 识别截图（最多9张）
      <input id="file" type="file" accept="image/*" multiple style="display:none" />
    </label>

    <button class="ghost" id="btnCopyAll">复制（带线路号）</button>
    <button class="ghost" id="btnCopyAddr">只复制地址</button>
    <button class="danger" id="btnClear">清空今天</button>
  </div>

  <input class="search" id="search" placeholder="搜索：线路号 / 街道 / 城市（可选）" />
  <div class="progress" id="progress"></div>
  <div class="list" id="list"></div>

  <div class="small">
    ✅ 默认：按线路号升序显示。<br/>
    ✅ 点“导航”自动✅已送，并跳转 Google Maps。<br/>
    ✅ OCR 偶尔错：点 ✏️ 改一条就行（会同步保存）。<br/>
  </div>
</div>

<script>
/* ========= 每天独立存储 ========= */
function todayKey(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const K_INPUT = "rn:input:"+todayKey();
const K_DONE  = "rn:done:"+todayKey();
const K_MODE  = "rn:mode"; // raw / asc / desc

/* ========= 状态 ========= */
let doneSet = new Set(JSON.parse(localStorage.getItem(K_DONE) || "[]"));
let orders = []; // {id,noStr,noNum,addr,done,idx}
let viewMode = localStorage.getItem(K_MODE) || "asc"; // 默认 asc

/* ========= DOM ========= */
const elInput = document.getElementById('input');
const elList  = document.getElementById('list');
const elStat  = document.getElementById('stat');
const elSearch= document.getElementById('search');
const elProg  = document.getElementById('progress');
const elFile  = document.getElementById('file');

const btnRaw  = document.getElementById('modeRaw');
const btnAsc  = document.getElementById('modeAsc');
const btnDesc = document.getElementById('modeDesc');

document.getElementById('btnBuild').onclick = buildList;
document.getElementById('btnClear').onclick = clearToday;
document.getElementById('btnCopyAll').onclick = ()=>copyText(makeCopyText(true));
document.getElementById('btnCopyAddr').onclick = ()=>copyText(makeCopyText(false));

elSearch.addEventListener('input', renderList);

btnRaw.onclick  = ()=>setMode("raw");
btnAsc.onclick  = ()=>setMode("asc");
btnDesc.onclick = ()=>setMode("desc");

/* ========= 恢复输入 ========= */
elInput.value = localStorage.getItem(K_INPUT) || "";
elInput.addEventListener('input', ()=> localStorage.setItem(K_INPUT, elInput.value));

/* ========= OCR 选择图片 ========= */
elFile.addEventListener('change', async ()=>{
  const files = Array.from(elFile.files || []);
  if(!files.length) return;
  if(files.length>9){
    alert("最多选 9 张图，请分两次。");
    return;
  }
  await ocrImages(files);
  elFile.value = "";
});

/* ========= 工具 ========= */
function showProg(msg){ elProg.style.display="block"; elProg.textContent = msg; }
function hideProg(){ elProg.style.display="none"; elProg.textContent=""; }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function saveDone(){ localStorage.setItem(K_DONE, JSON.stringify([...doneSet])); }

function cleanupAddr(s){
  let t = String(s||"").replace(/\s+/g," ").trim();
  t = t.replace(/\s*,\s*/g, ", ");
  return t;
}
function looksLikeAddress(s){
  const t = String(s||"");
  const suffix = /\b(St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Ln|Lane|Blvd|Boulevard|Ct|Court|Pl|Place|Way|Pkwy|Parkway|Ter|Terrace|Cir|Circle|Pike)\b/i;
  const hasNum = /\b\d{1,6}\b/.test(t);
  const hasArea = /\b(PA|Pittsburgh|Crafton|McKees\s*Rocks|Rosslyn)\b/i.test(t);
  return hasNum && suffix.test(t) && hasArea;
}

/* ========= 排序模式 ========= */
function setMode(m){
  viewMode = m;
  localStorage.setItem(K_MODE, viewMode);
  btnRaw.classList.toggle("on", viewMode==="raw");
  btnAsc.classList.toggle("on", viewMode==="asc");
  btnDesc.classList.toggle("on", viewMode==="desc");
  renderAll();
}

function getView(){
  const q = (elSearch.value||"").trim().toLowerCase();
  let arr = orders.slice();

  // 过滤
  if(q){
    arr = arr.filter(o => (o.noStr+" "+o.addr).toLowerCase().includes(q));
  }

  // ✅ 按线路号本身排序（asc/desc），raw 用原始索引
  if(viewMode==="raw"){
    arr.sort((a,b)=>a.idx-b.idx);
  }else if(viewMode==="asc"){
    arr.sort((a,b)=>a.noNum-b.noNum || a.idx-b.idx);
  }else{
    arr.sort((a,b)=>b.noNum-a.noNum || a.idx-b.idx);
  }

  return arr;
}

/* ========= 解析输入 ========= */
function parseLines(text){
  const lines = (text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  let auto = 1;
  for(const line of lines){
    const m = line.match(/^(?:NO\.?\s*)?(\d{1,4})[,\s，]+(.+)$/i);
    if(m){
      out.push({noStr:m[1], noNum:parseInt(m[1],10), addr:cleanupAddr(m[2])});
    }else{
      const noStr = "A"+String(auto++).padStart(3,'0');
      out.push({noStr, noNum:999999+auto, addr:cleanupAddr(line)});
    }
  }
  return out;
}

/* ========= 构建列表 ========= */
function buildList(){
  const parsed = parseLines(elInput.value || "");
  orders = parsed.map((p,i)=>{
    const id = p.noStr + "||" + p.addr;
    return { id, noStr:p.noStr, noNum:p.noNum, addr:p.addr, done: doneSet.has(id), idx:i };
  });

  // 清理 doneSet 里不存在的
  const valid = new Set(orders.map(o=>o.id));
  doneSet = new Set([...doneSet].filter(x=>valid.has(x)));
  saveDone();

  renderAll();
}

/* ========= 统计 ========= */
function renderStat(){
  const total = orders.length;
  const sent = orders.filter(o=>o.done).length;
  elStat.textContent = `📦 今日共 ${total} 单 ｜ ✅ 已送 ${sent} ｜ 🕒 剩余 ${total - sent}`;
}

/* ========= 渲染列表 ========= */
function renderList(){
  elList.innerHTML = "";

  const view = getView();

  view.forEach(o=>{
    const card = document.createElement("div");
    card.className = "card" + (o.done ? " delivered" : "");
    card.innerHTML = `
      <div class="left">
        <div class="no">NO.${escapeHtml(o.noStr)}</div>
        <div style="min-width:0">
          <div class="addr">${escapeHtml(o.addr)}</div>
          <div class="sub">${viewMode==="raw" ? "原始顺序" : (viewMode==="asc" ? "线路号升序" : "线路号降序")}｜点导航自动✅</div>
        </div>
      </div>
      <div class="actions">
        <button class="editbtn" title="编辑">✏️</button>
        <input class="chk" type="checkbox" ${o.done?"checked":""}/>
        <button class="navbtn">▶ 导航</button>
      </div>
    `;

    card.querySelector(".chk").addEventListener("change", e=>{
      o.done = e.target.checked;
      if(o.done) doneSet.add(o.id); else doneSet.delete(o.id);
      saveDone(); renderAll();
    });

    card.querySelector(".navbtn").addEventListener("click", ()=>startNav(o));

    card.querySelector(".editbtn").addEventListener("click", ()=>{
      const newNo = prompt("改线路号（1-4位数字）", o.noStr);
      if(newNo===null) return;
      const nn = String(newNo).trim();
      if(!/^\d{1,4}$/.test(nn)){ alert("线路号必须是1-4位数字"); return; }

      const newAddr = prompt("改地址", o.addr);
      if(newAddr===null) return;
      const na = cleanupAddr(newAddr.trim());
      if(!na){ alert("地址不能为空"); return; }

      const oldId = o.id;
      const wasDone = o.done || doneSet.has(oldId);
      doneSet.delete(oldId);

      o.noStr = nn; o.noNum = parseInt(nn,10); o.addr = na;
      o.id = o.noStr + "||" + o.addr;

      if(wasDone){ o.done=true; doneSet.add(o.id); }
      saveDone();

      // 同步到输入框（保持原始输入顺序的 idx 不变）
      const lines = orders
        .sort((a,b)=>a.idx-b.idx)
        .map(x=>`${x.noStr} ${x.addr}`)
        .join("\n");
      elInput.value = lines;
      localStorage.setItem(K_INPUT, elInput.value);

      renderAll();
    });

    elList.appendChild(card);
  });

  renderStat();
}
function renderAll(){ renderStat(); renderList(); }

/* ========= 导航：Google Maps + 自动✅ ========= */
function startNav(o){
  if(!o.done){
    o.done = true;
    doneSet.add(o.id);
    saveDone();
    renderAll();
  }
  const url = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(o.addr) + "&travelmode=driving";
  window.location.href = url;
}

/* ========= 复制（按当前显示顺序复制） ========= */
function makeCopyText(withNo){
  const view = getView();
  return withNo ? view.map(o=>`${o.noStr} ${o.addr}`).join("\n")
                : view.map(o=>o.addr).join("\n");
}
async function copyText(txt){
  try{
    await navigator.clipboard.writeText(txt);
    alert("已复制 ✅");
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
    alert("已复制 ✅");
  }
}

/* ========= 清空今天 ========= */
function clearToday(){
  if(!confirm("确定清空今天吗？")) return;
  orders=[]; doneSet=new Set();
  localStorage.removeItem(K_INPUT);
  localStorage.removeItem(K_DONE);
  elInput.value=""; elSearch.value="";
  hideProg();
  renderAll();
}

/* ==========================================================
   OCR：按“你人工识别截图的思路”
   - 同一行里：较小数字=线路号（1-4位）；较大数字=门牌号
   - 地址从门牌号开始截到路名后缀
   - 顺序：按图片顺序 + 行出现顺序写入输入框
========================================================== */
function mergeSplitDigits(line){
  let s = line.replace(/\s+/g," ").trim();
  const m = s.match(/^(\d)\s+(\d)(?:\s+(\d))?(?:\s+(\d))?\s+/);
  if(m){
    const d = [m[1],m[2],m[3],m[4]].filter(Boolean).join("");
    if(d.length>=2 && d.length<=4){
      return d + " " + s.slice(m[0].length);
    }
  }
  const m2 = s.match(/^(\d{1,3})\s+(\d)\s+/);
  if(m2){
    const d = (m2[1]+m2[2]);
    if(d.length>=2 && d.length<=4){
      return d + " " + s.slice(m2[0].length);
    }
  }
  return s;
}

function extractPairsFromText(text){
  const lines = String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const out = [];
  const suffix = "(ST|STREET|AVE|AVENUE|RD|ROAD|DR|DRIVE|LN|LANE|BLVD|BOULEVARD|CT|COURT|PL|PLACE|WAY|CIR|CIRCLE|PIKE|PKWY|PARKWAY|TER|TERRACE)";

  for(let raw of lines){
    let line = raw.toUpperCase()
      .replace(/\u00A0/g," ")
      .replace(/[，]/g,",")
      .replace(/\s+/g," ")
      .trim();

    line = mergeSplitDigits(line);

    if(!looksLikeAddress(line)) continue;

    // 取前4个数字候选（避免把日期/杂项混进来）
    const ns = (line.match(/\b\d{1,5}\b/g) || []);
    const first = [];
    for(const s of ns){
      const n = parseInt(s,10);
      if(Number.isNaN(n)) continue;
      if(n>=1900 && n<=2100) continue;
      first.push(n);
      if(first.length>=4) break;
    }
    if(first.length<2) continue;

    const a = first[0], b = first[1];
    const route = Math.min(a,b);
    const house = Math.max(a,b);

    if(!(route>=1 && route<=9999)) continue;

    const re = new RegExp("\\b"+house+"\\b\\s+.+?\\b"+suffix+"\\b");
    const mAddr = line.match(re);
    if(!mAddr) continue;

    let addr = cleanupAddr(mAddr[0]);
    // 尽量补全城市州（如果本行包含）
    if(/\bPITTSBURGH\b/.test(line) && !/PITTSBURGH/i.test(addr)) addr += ", Pittsburgh";
    if(/\bPA\b/.test(line) && !/\bPA\b/i.test(addr)) addr += ", PA";

    out.push({noStr:String(route), addr});
  }

  return out;
}

async function preprocessImageToCanvas(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = 1.6;
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);

      const c = document.createElement("canvas");
      c.width=w; c.height=h;
      const ctx = c.getContext("2d", { willReadFrequently:true });
      ctx.drawImage(img, 0, 0, w, h);

      const im = ctx.getImageData(0,0,w,h);
      const d = im.data;
      const contrast = 1.25;
      for(let i=0;i<d.length;i+=4){
        let y = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        y = (y-128)*contrast + 128;
        y = Math.max(0, Math.min(255, y));
        const v = y > 175 ? 255 : (y < 70 ? 0 : y);
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(im,0,0);
      resolve(c);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function sliceCanvas(canvas, sliceH=1400, overlap=220){
  const w=canvas.width, h=canvas.height;
  const out=[];
  let y=0;
  while(y<h){
    const top = Math.max(0, y - (y===0?0:overlap));
    const bottom = Math.min(h, y+sliceH);
    const sh = bottom-top;

    const c=document.createElement("canvas");
    c.width=w; c.height=sh;
    c.getContext("2d").drawImage(canvas, 0, top, w, sh, 0, 0, w, sh);
    out.push(c);

    if(bottom>=h) break;
    y += sliceH;
  }
  return out;
}

async function ocrImages(files){
  try{
    showProg("OCR 准备中…（第一次可能慢一点）");
    const worker = await Tesseract.createWorker("eng");

    const pairsAll = [];
    for(let i=0;i<files.length;i++){
      showProg(`OCR 第 ${i+1}/${files.length} 张：预处理…`);
      const base = await preprocessImageToCanvas(files[i]);
      const slices = sliceCanvas(base, 1400, 220);

      let merged = "";
      for(let s=0;s<slices.length;s++){
        showProg(`OCR 第 ${i+1}/${files.length} 张：切片 ${s+1}/${slices.length} 识别中…`);
        const { data } = await worker.recognize(slices[s], {
          tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
          preserve_interword_spaces: "1"
        });
        merged += "\n" + (data && data.text ? data.text : "");
      }

      const pairs = extractPairsFromText(merged);
      pairsAll.push(...pairs);
    }

    await worker.terminate();

    // 去重（保持首次出现顺序）
    const seen = new Set();
    const uniq = [];
    for(const p of pairsAll){
      const key = p.noStr + "||" + p.addr.toLowerCase();
      if(seen.has(key)) continue;
      seen.add(key);
      uniq.push(p);
    }

    if(!uniq.length){
      showProg("OCR 完成，但没提取到有效地址。建议：截图里每张包含 6-12 单，文字更大更清晰。");
      alert("没有识别到有效的“线路号+地址”。");
      return;
    }

    // 写入输入框（按出现顺序）
    elInput.value = uniq.map(x=>`${x.noStr} ${x.addr}`).join("\n");
    localStorage.setItem(K_INPUT, elInput.value);

    hideProg();
    buildList(); // ✅ 构建后按线路号排序显示（默认 asc）

  }catch(e){
    console.error(e);
    showProg("OCR 出错了：可能图片太大/网络不稳定。建议分两次（每次4-6张）");
    alert("OCR 出错：请分批识别或换更清晰的截图。");
  }
}

/* ========= 初始化 ========= */
btnRaw.classList.toggle("on", viewMode==="raw");
btnAsc.classList.toggle("on", viewMode==="asc");
btnDesc.classList.toggle("on", viewMode==="desc");

buildList();
</script>
</body>
</html>
