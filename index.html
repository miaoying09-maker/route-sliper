<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>路线助手（纯列表最终版 + OCR）</title>

<!-- OCR：Tesseract.js（纯前端，不用服务器） -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e8e8ee;
    --blue:#1a73e8; --dark:#111; --muted:#666;
    --green:#1bbf5c; --red:#c62828;
  }
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial}
  .wrap{max-width:820px;margin:0 auto;padding:12px}
  h2{margin:8px 0 10px;font-size:26px}
  textarea{
    width:100%;height:150px;box-sizing:border-box;border-radius:14px;border:1px solid var(--line);
    padding:12px;font-size:14px;line-height:1.35;background:#fff
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
  button{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900}
  .primary{background:var(--blue);color:#fff}
  .ghost{background:#fff;border:1px solid var(--line);color:#111}
  .danger{background:#fff;border:1px solid #ffb3b3;color:var(--red)}
  .small{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.35}

  /* 置顶统计栏（一直看得到） */
  .sticky{
    position:sticky; top:0; z-index:999;
    background:var(--bg); padding-top:8px;
  }
  .stat{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;
    font-size:16px;font-weight:900;display:flex;gap:12px;flex-wrap:wrap;align-items:center
  }

  /* 排序 */
  .sortbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .sortbtn{background:#fff;border:1px solid var(--line);color:#111}
  .sortbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* 搜索 */
  .search{
    width:100%;box-sizing:border-box;margin:8px 0 0;
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;background:#fff
  }

  /* 列表卡片 */
  .list{margin-top:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-top:10px;
  }
  .left{min-width:0;display:flex;gap:12px;align-items:flex-start}
  .no{
    background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;
    font-weight:1000;font-size:16px;line-height:1;
    flex:0 0 auto
  }
  .addr{font-size:15px;font-weight:900;line-height:1.25;word-break:break-word}
  .sub{font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
  .actions{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  .chk{width:22px;height:22px;transform:scale(1.15)}
  .navbtn{background:var(--blue);color:#fff;border-radius:14px;padding:12px 14px;font-weight:1000}
  .editbtn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:1000}
  .delivered{opacity:.45}

  /* 进度条 */
  .progress{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;
    font-size:13px;color:#111;font-weight:800;
  }
  .bar{
    height:10px;background:#eee;border-radius:999px;overflow:hidden;margin-top:8px
  }
  .bar > div{height:100%;width:0;background:var(--blue)}
</style>
</head>

<body>
<div class="wrap">
  <h2>路线助手（纯列表最终版 + OCR）</h2>

  <textarea id="input" placeholder="方式1：粘贴（每行：线路号 空格 地址）
例：
55 1112 Berkshire Ave, Pittsburgh, PA
56 1237 Berkshire Ave, Pittsburgh, PA

方式2：点【识别截图】最多9张（推荐）
会自动提取“线路号 + 地址”"></textarea>

  <div class="row">
    <button class="primary" id="btnBuild">生成列表</button>
    <button class="ghost" id="btnOCR">📷 识别截图（最多9张）</button>
    <button class="ghost" id="btnPaste">📋 从剪贴板粘贴</button>
    <button class="ghost" id="btnCopyAll">复制（带线路号）</button>
    <button class="ghost" id="btnCopyAddr">只复制地址</button>
    <button class="danger" id="btnClear">清空今天</button>
  </div>

  <div class="sticky">
    <div class="stat" id="stat">📦 今日共 0 单 ｜ ✅ 已送 0 ｜ 🕒 剩余 0</div>

    <div class="sortbar">
      <button class="sortbtn" id="sortRaw">原始顺序</button>
      <button class="sortbtn on" id="sortAsc">线路号升序（默认）</button>
      <button class="sortbtn" id="sortDesc">线路号降序</button>
    </div>

    <input class="search" id="search" placeholder="搜索：线路号 / 街道 / 城市（例如 55 或 Berkshire）" />
    <div id="progress" class="progress" style="display:none">
      <div id="progText">OCR 准备中…</div>
      <div class="bar"><div id="progBar"></div></div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="small">
    ✅ 点“导航”会自动勾选已送达，并跳转 Google Maps。<br/>
    ✅ 线路号每天不一样没关系：系统按“今天”独立保存（明天自动新的一天）。<br/>
    ✅ OCR 可能偶尔把号/地址识别错：点 ✏️ 只改这一条就行（会同步保存）。<br/>
    ✅ OCR 逻辑：优先抓 1–4 位“线路号”，再抓地址（门牌号 + 街道名 + 城市/PA）。<br/>
  </div>

  <!-- 多选图片 -->
  <input id="file" type="file" accept="image/*" multiple style="display:none" />
</div>

<script>
/* ===================== 存储：按天独立 ===================== */
function todayKey(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const K_INPUT = "rn2:input:"+todayKey();
const K_DONE  = "rn2:done:"+todayKey();
const K_SORT  = "rn2:sort";
const K_FIX   = "rn2:fix:"+todayKey(); // 手改后的条目存这里

let doneSet = new Set(JSON.parse(localStorage.getItem(K_DONE) || "[]"));
let sortMode = localStorage.getItem(K_SORT) || "asc"; // raw / asc / desc
let fixedMap = JSON.parse(localStorage.getItem(K_FIX) || "{}"); // id -> {noStr, addr}

/* ===================== 数据 ===================== */
let orders = []; // {id,noStr,noNum,addr,done}

/* ===================== DOM ===================== */
const elInput = document.getElementById('input');
const elList  = document.getElementById('list');
const elStat  = document.getElementById('stat');
const elSearch= document.getElementById('search');
const elFile  = document.getElementById('file');
const elProg  = document.getElementById('progress');
const elProgText = document.getElementById('progText');
const elProgBar  = document.getElementById('progBar');

document.getElementById('btnBuild').onclick = buildList;
document.getElementById('btnClear').onclick = clearToday;
document.getElementById('btnCopyAll').onclick = ()=>copyText(makeCopyText(true));
document.getElementById('btnCopyAddr').onclick = ()=>copyText(makeCopyText(false));
document.getElementById('btnOCR').onclick = ()=>elFile.click();
document.getElementById('btnPaste').onclick = pasteFromClipboard;

document.getElementById('sortRaw').onclick  = ()=>setSort("raw");
document.getElementById('sortAsc').onclick  = ()=>setSort("asc");
document.getElementById('sortDesc').onclick = ()=>setSort("desc");

elSearch.addEventListener('input', renderList);

elFile.addEventListener('change', async ()=>{
  const files = Array.from(elFile.files || []);
  elFile.value = "";
  if(!files.length) return;

  if(files.length > 9){
    alert("最多选择 9 张图。你现在选了 "+files.length+" 张。");
    return;
  }

  await runOCR(files);
});

/* ===================== 恢复输入 ===================== */
elInput.value = localStorage.getItem(K_INPUT) || "";
elInput.addEventListener('input', ()=> localStorage.setItem(K_INPUT, elInput.value));

/* ===================== 粘贴板 ===================== */
async function pasteFromClipboard(){
  try{
    const txt = await navigator.clipboard.readText();
    if(!txt) return alert("剪贴板为空");
    elInput.value = (elInput.value ? (elInput.value.trimEnd()+"\n") : "") + txt.trim();
    localStorage.setItem(K_INPUT, elInput.value);
    buildList();
  }catch(e){
    alert("无法读取剪贴板（请在 Safari 里允许粘贴权限）");
  }
}

/* ===================== 解析：粘贴文本（每行：号 地址） ===================== */
function parseLines(text){
  const lines = (text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const line of lines){
    // 支持：NO.55 / 55, / 55 空格 / 55 1112 Berkshire...
    const m = line.match(/^(?:NO\.?\s*)?(\d{1,4})[,\s，]+(.+)$/i);
    if(m){
      out.push({noStr:m[1], noNum:parseInt(m[1],10), addr:m[2].trim()});
    }
  }
  return out;
}

/* ===================== 排序 ===================== */
function setSort(mode){
  sortMode = mode;
  localStorage.setItem(K_SORT, sortMode);
  document.getElementById('sortRaw').classList.toggle('on', sortMode==="raw");
  document.getElementById('sortAsc').classList.toggle('on', sortMode==="asc");
  document.getElementById('sortDesc').classList.toggle('on', sortMode==="desc");
  renderAll();
}
function sortOrders(arr){
  const a = arr.slice();
  if(sortMode==="raw") return a; // 原始顺序
  a.sort((x,y)=> sortMode==="asc" ? (x.noNum-y.noNum) : (y.noNum-x.noNum));
  return a;
}

/* ===================== 构建列表 ===================== */
function buildList(){
  const parsed = parseLines(elInput.value || "");

  orders = parsed.map(p=>{
    const id = p.noStr + "||" + p.addr; // 基础唯一键
    // 如果用户手改过，优先用手改
    const fix = fixedMap[id];
    const noStr = fix?.noStr || p.noStr;
    const addr  = fix?.addr  || p.addr;
    const noNum = parseInt(noStr,10);

    return {
      id,
      noStr,
      noNum: Number.isFinite(noNum) ? noNum : 999999,
      addr,
      done: doneSet.has(id),
    };
  });

  saveDone();
  renderAll();
}

/* ===================== 统计 ===================== */
function renderStat(){
  const total = orders.length;
  const sent = orders.filter(o=>o.done).length;
  elStat.textContent = `📦 今日共 ${total} 单 ｜ ✅ 已送 ${sent} ｜ 🕒 剩余 ${total - sent}`;
}

/* ===================== 列表渲染 ===================== */
function renderList(){
  elList.innerHTML = "";
  const q = (elSearch.value || "").trim().toLowerCase();

  let view = sortOrders(orders);
  if(q){
    view = view.filter(o => (`${o.noStr} ${o.addr}`).toLowerCase().includes(q));
  }

  view.forEach(o=>{
    const card = document.createElement('div');
    card.className = "card" + (o.done ? " delivered" : "");
    card.innerHTML = `
      <div class="left">
        <div class="no">NO.${escapeHtml(o.noStr)}</div>
        <div style="min-width:0">
          <div class="addr">${escapeHtml(o.addr)}</div>
          <div class="sub">点导航自动✅ ｜ ✏️可手改 ｜ 按线路号排序</div>
        </div>
      </div>
      <div class="actions">
        <button class="editbtn" title="手动修改">✏️</button>
        <input class="chk" type="checkbox" ${o.done?"checked":""} />
        <button class="navbtn">▶ 导航</button>
      </div>
    `;

    // 手动勾选
    card.querySelector('.chk').addEventListener('change', (e)=>{
      o.done = e.target.checked;
      if(o.done) doneSet.add(o.id);
      else doneSet.delete(o.id);
      saveDone();
      renderAll();
    });

    // 导航
    card.querySelector('.navbtn').addEventListener('click', ()=>{
      startNav(o);
    });

    // 手改
    card.querySelector('.editbtn').addEventListener('click', ()=>{
      const newNo = prompt("修改线路号（1-4位数字）", o.noStr);
      if(newNo===null) return;
      const noClean = String(newNo).trim().replace(/^NO\.?/i,'').trim();
      if(!/^\d{1,4}$/.test(noClean)){
        alert("线路号必须是 1-4 位数字");
        return;
      }
      const newAddr = prompt("修改地址（建议包含城市/PA）", o.addr);
      if(newAddr===null) return;

      // 保存到 fixedMap（按原始 id 存）
      fixedMap[o.id] = {noStr:noClean, addr:String(newAddr).trim()};
      localStorage.setItem(K_FIX, JSON.stringify(fixedMap));

      // 应用到当前对象
      o.noStr = noClean;
      o.noNum = parseInt(noClean,10);
      o.addr  = String(newAddr).trim();
      renderAll();
    });

    elList.appendChild(card);
  });

  renderStat();
}
function renderAll(){
  renderStat();
  renderList();
}

/* ===================== 已送存储 ===================== */
function saveDone(){
  localStorage.setItem(K_DONE, JSON.stringify([...doneSet]));
}

/* ===================== 导航：Google Maps（自动✅） ===================== */
function startNav(o){
  if(!o.done){
    o.done = true;
    doneSet.add(o.id);
    saveDone();
    renderAll();
  }
  const url = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(o.addr) + "&travelmode=driving";
  window.location.href = url;
}

/* ===================== 复制 ===================== */
function makeCopyText(withNo){
  const view = sortOrders(orders);
  if(withNo) return view.map(o=>`${o.noStr} ${o.addr}`).join("\n");
  return view.map(o=>o.addr).join("\n");
}
async function copyText(txt){
  try{
    await navigator.clipboard.writeText(txt);
    alert("已复制 ✅");
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert("已复制 ✅");
  }
}

/* ===================== 清空今天 ===================== */
function clearToday(){
  if(!confirm("确定清空今天的数据吗？")) return;
  localStorage.removeItem(K_INPUT);
  localStorage.removeItem(K_DONE);
  localStorage.removeItem(K_FIX);
  doneSet = new Set();
  fixedMap = {};
  orders = [];
  elInput.value = "";
  renderAll();
}

/* ===================== OCR：核心思路（按你平时识别截图的逻辑） ===================== */
/*
目标：从“配送中列表截图”里抓到：
1) 线路号：1-4位数字（通常很大、单独一块）
2) 地址：门牌号 + 街道名 + (城市/PA)
做法：
- 每张图自动切成 4 片（上到下），每片 OCR
- 每片里用规则抓：routeNo + address
- 合并去重 -> 写回 textarea -> 生成列表
*/
function showProgress(on){
  elProg.style.display = on ? "block" : "none";
  if(!on){ elProgText.textContent=""; elProgBar.style.width="0%"; }
}
function setProgress(text, pct){
  elProgText.textContent = text;
  elProgBar.style.width = Math.max(0, Math.min(100, pct||0)) + "%";
}

/* 把图片切成 N 片（横向切） */
async function sliceImage(file, parts=4){
  const img = await fileToImage(file);
  const w = img.naturalWidth, h = img.naturalHeight;
  const canvases = [];
  for(let i=0;i<parts;i++){
    const y0 = Math.floor(h * i / parts);
    const y1 = Math.floor(h * (i+1) / parts);
    const ch = Math.max(1, y1-y0);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = ch;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, y0, w, ch, 0, 0, w, ch);
    canvases.push(c);
  }
  return canvases;
}
function fileToImage(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

/* OCR 一片 canvas */
async function ocrCanvas(canvas, onProgress){
  const { data } = await Tesseract.recognize(
    canvas,
    "eng", // 英文地址更重要；中文“路线号”即使丢了也不影响
    {
      logger: m=>{
        if(m.status==="recognizing text" && onProgress){
          onProgress(m.progress || 0);
        }
      }
    }
  );
  return (data && data.text) ? data.text : "";
}

/* 从 OCR 文本里提取：线路号 + 地址 */
function extractPair(text){
  const t = normalizeText(text);

  // 1) 找地址（优先）
  const addr = extractAddress(t);
  if(!addr) return null;

  // 2) 找线路号（1-4位）
  const no = extractRouteNo(t, addr);
  if(!no) return null;

  return {noStr:no, addr};
}

/* 清洗：把奇怪的换行/多空格整理一下 */
function normalizeText(s){
  return String(s||"")
    .replace(/\r/g,"\n")
    .replace(/[|•·]+/g," ")
    .replace(/[，]/g,",")
    .replace(/\s+\n/g,"\n")
    .replace(/\n\s+/g,"\n")
    .replace(/[ \t]{2,}/g," ")
    .trim();
}

/* 抓地址：门牌号 + 街道名 + (城市/PA) */
function extractAddress(t){
  // 常见街道后缀
  const suffix = "(St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Blvd|Boulevard|Ln|Lane|Ct|Court|Pl|Place|Way|Pike|Cir|Circle|Ter|Terrace|Hwy|Highway)";
  // 城市（你常见的）
  const city = "(Pittsburgh|Crafton|McKees\\s*Rocks|Rosslyn\\s*Farms|Allegheny)";
  // 地址模式：1112 Berkshire Ave, Pittsburgh, PA
  const re1 = new RegExp("(\\d{1,5}\\s+[A-Za-z0-9.'-]+(?:\\s+[A-Za-z0-9.'-]+){0,4}\\s+"+suffix+"\\b[^\\n]{0,60}?\\b"+city+"\\b[^\\n]{0,30}?\\bPA\\b(?:\\s*\\d{5})?)","i");
  const m1 = t.match(re1);
  if(m1) return cleanAddr(m1[1]);

  // 兜底：1112 Berkshire Ave ...（没有城市/PA也先抓）
  const re2 = new RegExp("(\\d{1,5}\\s+[A-Za-z0-9.'-]+(?:\\s+[A-Za-z0-9.'-]+){0,6}\\s+"+suffix+"\\b[^\\n]{0,60})","i");
  const m2 = t.match(re2);
  if(m2) return cleanAddr(m2[1]);

  return null;
}
function cleanAddr(a){
  return String(a)
    .replace(/\s*,\s*/g,", ")
    .replace(/\s{2,}/g," ")
    .replace(/\s*\.\.\.\s*$/,"")
    .trim();
}

/*
抓线路号：
- 只要 1-4 位数字
- 排除日期(2026/01/19)、距离(3.2)、邮编(15205)等
- 优先：出现在“路线号”附近 或 单独一行的大数字
- 如果 OCR 把“路线号”丢了：用“地址门牌号”做排除（不要拿门牌号当线路号）
*/
function extractRouteNo(t, addr){
  const addrNum = (addr.match(/\b(\d{1,5})\b/)||[])[1] || "";

  // 先试：路线号附近（如果 OCR 识别到了中文）
  const near = t.match(/(?:路线号|路線號)\s*[:：]?\s*(\d{1,4})/);
  if(near) return near[1];

  // 再试：找“单独一行”的 1-4 位
  const lines = t.split("\n").map(s=>s.trim()).filter(Boolean);
  const candidates = [];
  for(const line of lines){
    // 过滤：日期、距离、邮编
    if(/\b20\d{2}\b/.test(line)) continue;          // 年份
    if(/\b\d+\.\d+\b/.test(line)) continue;         // 小数（距离）
    if(/\b\d{5}\b/.test(line) && line.length<=8) continue; // 单独邮编
    // 单独数字行：55
    const m = line.match(/^(\d{1,4})$/);
    if(m){
      const n = m[1];
      if(addrNum && n===addrNum) continue; // 不要把门牌号当线路号（遇到 4 位门牌更关键）
      candidates.push({n, score: 100});
      continue;
    }
    // 行首数字（例如：55 Raghid Ibrahim ...）
    const m2 = line.match(/^(\d{1,4})\b/);
    if(m2){
      const n = m2[1];
      if(addrNum && n===addrNum) continue;
      // 如果这一行还出现了地址的街道后缀词，说明这更像“门牌号行”，降分
      let score = 60;
      if(/\b(St|Street|Ave|Avenue|Rd|Road|Dr|Drive|Blvd|Lane|Ln|Ct|Pl|Way|Pike)\b/i.test(line)) score -= 25;
      candidates.push({n, score});
    }
  }

  if(!candidates.length) return null;

  // 取最高分；同分取“更短更像路线号”的（1-3位优先，但也支持4位）
  candidates.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    if(a.n.length!==b.n.length) return a.n.length-b.n.length;
    return parseInt(a.n,10)-parseInt(b.n,10);
  });

  return candidates[0].n;
}

/* OCR 主流程 */
async function runOCR(files){
  showProgress(true);
  setProgress("OCR 准备中…", 1);

  const results = [];
  let done = 0;
  const totalSlices = files.length * 4;

  for(let i=0;i<files.length;i++){
    const f = files[i];
    setProgress(`OCR 第 ${i+1}/${files.length} 张：切片中…`, Math.floor(done/totalSlices*100));

    const slices = await sliceImage(f, 4);

    for(let s=0;s<slices.length;s++){
      const idx = (i*4 + s + 1);
      const label = `OCR 第 ${i+1}/${files.length} 张：切片 ${s+1}/4 识别中…`;
      let lastP = 0;

      const text = await ocrCanvas(slices[s], (p)=>{
        // p: 0~1
        const pct = Math.floor(((done + p) / totalSlices) * 100);
        if(p > lastP + 0.05){
          setProgress(label, pct);
          lastP = p;
        }
      });

      done++;

      // 每片抽取
      const pair = extractPair(text);
      if(pair) results.push(pair);
    }
  }

  // 去重：同号同地址
  const uniq = [];
  const seen = new Set();
  for(const r of results){
    const key = r.noStr + "||" + r.addr;
    if(seen.has(key)) continue;
    seen.add(key);
    uniq.push(r);
  }

  showProgress(false);

  if(!uniq.length){
    alert("没有识别到有效的“线路号 + 地址”。\n\n建议：\n1) 用你图二那种“配送中列表”截图（一屏3-5张卡片）\n2) 不要太糊/太小\n3) 截图里必须看得到地址那一行");
    return;
  }

  // 写回 textarea（按你要求：按线路号本身排序默认升序）
  const lines = uniq.map(x=>`${x.noStr} ${x.addr}`).join("\n");
  elInput.value = lines;
  localStorage.setItem(K_INPUT, elInput.value);

  // 默认升序
  setSort("asc");
  buildList();

  alert(`OCR 完成 ✅ 提取到 ${uniq.length} 条（已自动按线路号排序）\n\n如果有个别错的：点 ✏️ 手动改那一条就行。`);
}

/* ===================== 安全输出 ===================== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* ===================== 初始化 ===================== */
(function init(){
  // 默认升序按钮状态
  document.getElementById('sortRaw').classList.toggle('on', sortMode==="raw");
  document.getElementById('sortAsc').classList.toggle('on', sortMode==="asc");
  document.getElementById('sortDesc').classList.toggle('on', sortMode==="desc");

  buildList();
})();
</script>
